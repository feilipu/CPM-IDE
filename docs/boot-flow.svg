<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1222" viewBox="0 0 1200 1222" role="img" aria-labelledby="title desc">
<title id="title">Boot, warm boot and returning to the shell</title><desc id="desc">Current ROM · simplified control flow</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#49637c"/></marker></defs>
<rect width="1200" height="100%" rx="18" fill="#f7fafc"/>
<g font-family="DejaVu Sans, sans-serif" fill="#18324c">
<text x="36" y="46" font-size="29" fill="#18324c" font-weight="bold">Boot, warm boot and returning to the shell</text>
<text x="36" y="78" font-size="17" fill="#48617a">Current ROM · simplified control flow</text>
<rect x="400" y="110" width="400" height="85" rx="12" fill="#fff0cc" stroke="#7890a6" stroke-width="1.5"/>
<text x="600.0" y="148.0" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">Cold start → ROM CRT</text>
<text x="600.0" y="177.0" font-size="18" fill="#18324c" text-anchor="middle">Copy CCP / resident stub / BIOS</text>
<rect x="400" y="235" width="400" height="100" rx="12" fill="#fff0cc" stroke="#7890a6" stroke-width="1.5"/>
<text x="600.0" y="280.5" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">main → FAT mount → YASH</text>
<text x="600.0" y="309.5" font-size="18" fill="#18324c" text-anchor="middle">Initialise C state; select console</text>
<rect x="400" y="375" width="400" height="105" rx="12" fill="#dcecff" stroke="#7890a6" stroke-width="1.5"/>
<text x="600.0" y="423.0" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">Root CPMIDE.CFG names A:?</text>
<text x="600.0" y="452.0" font-size="18" fill="#18324c" text-anchor="middle">Automatic boot only from root</text>
<polyline points="600,195 600,235" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="600,335 600,375" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="535" width="340" height="100" rx="12" fill="#dff3e8" stroke="#7890a6" stroke-width="1.5"/>
<text x="210.0" y="580.5" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">FAT shell: &gt;</text>
<text x="210.0" y="609.5" font-size="18" fill="#18324c" text-anchor="middle">ls / cd / xget / cpm</text>
<rect x="780" y="535" width="380" height="100" rx="12" fill="#eee6ff" stroke="#7890a6" stroke-width="1.5"/>
<text x="970.0" y="580.5" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">cpm_boot → BIOS cold boot</text>
<text x="970.0" y="609.5" font-size="18" fill="#18324c" text-anchor="middle">RAM in; page zero; canary $AA55</text>
<polyline points="400,430 210,430 210,535" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="263" y="416" font-size="19" fill="#18324c" font-weight="bold">No</text>
<polyline points="800,430 970,430 970,535" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="850" y="416" font-size="19" fill="#18324c" font-weight="bold">Yes</text>
<polyline points="380,585 780,585" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430" y="550" font-size="21" fill="#18324c" font-weight="bold">cpm [directory]</text>
<text x="430" y="574" font-size="17" fill="#18324c">Map drives; require A:</text>
<rect x="780" y="690" width="380" height="100" rx="12" fill="#dff3e8" stroke="#7890a6" stroke-width="1.5"/>
<text x="970.0" y="735.5" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">CP/M CCP: A&gt;</text>
<text x="970.0" y="764.5" font-size="18" fill="#18324c" text-anchor="middle">DIR / TYPE / COM programs</text>
<polyline points="970,635 970,690" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="440" y="865" width="340" height="120" rx="12" fill="#eee6ff" stroke="#7890a6" stroke-width="1.5"/>
<text x="610.0" y="908.0" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">Normal warm boot</text>
<text x="610.0" y="937.0" font-size="18" fill="#18324c" text-anchor="middle">JP 0; intact $AA55</text>
<text x="610.0" y="962.0" font-size="18" fill="#18324c" text-anchor="middle">Reload CCP/stub; keep map</text>
<polyline points="850,790 850,825 610,825 610,865" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="780,925 1180,925 1180,740 1160,740" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="865" width="340" height="120" rx="12" fill="#fff0cc" stroke="#7890a6" stroke-width="1.5"/>
<text x="210.0" y="908.0" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">CCP EXIT</text>
<text x="210.0" y="937.0" font-size="18" fill="#18324c" text-anchor="middle">Canary becomes $5555</text>
<text x="210.0" y="962.0" font-size="18" fill="#18324c" text-anchor="middle">Restart shell; clear FAT state</text>
<polyline points="780,740 210,740 210,865" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="40,925 20,925 20,585 40,585" fill="none" stroke="#49637c" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="1040" width="1120" height="85" rx="12" fill="#dff3e8" stroke="#7890a6" stroke-width="1.5"/>
<text x="600.0" y="1078.0" font-size="21" fill="#18324c" text-anchor="middle" font-weight="bold">EXIT stays at the shell prompt</text>
<text x="600.0" y="1107.0" font-size="18" fill="#18324c" text-anchor="middle">The root config is not allowed to immediately auto-boot again on this return</text>
<text x="36" y="1166" font-size="16" fill="#48617a">Neither cold boot nor warm boot loads CP/M from a disk system track. The operating-system images are in ROM.</text>
<text x="36" y="1198" font-size="16" fill="#48617a">Graphics by Petr Antos</text>
</g></svg>
